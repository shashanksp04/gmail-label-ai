<!doctype html>
<html><head><meta charset="UTF-8"><title>LabelPilot</title><style>body{width:390px;padding:16px;font:14px system-ui;color:#202124}button,select{width:100%;padding:9px;margin:5px 0;border-radius:6px;border:1px solid #dadce0}button{background:#1a73e8;color:white;border:0}.secondary{background:white;color:#1a73e8;border:1px solid #1a73e8}.danger{color:#b3261e;border-color:#b3261e;background:white}.status{padding:10px;background:#f1f3f4;border-radius:6px;margin:8px 0}.activity{max-height:230px;overflow:auto;font-size:12px}.activity div{border-bottom:1px solid #eee;padding:5px 0}</style></head><body><h2>LabelPilot</h2><div id="status" class="status">Loading…</div><div id="aiStatus" class="status">AI: checking</div><button id="link">Link Gmail account</button><select id="accounts" hidden></select><button id="switch" hidden class="secondary">Switch account</button><button id="initialize" hidden class="secondary">Initialize AI</button><button id="preview" hidden class="secondary">Run preview</button><button id="automation" hidden>Enable automation</button><button id="refresh" hidden class="secondary">Refresh labels</button><button id="unlink" hidden class="danger">Unlink account</button><h3>Recent activity</h3><div id="activity" class="activity">No activity</div><script type="module" src="./popup.ts"></script></body></html>
